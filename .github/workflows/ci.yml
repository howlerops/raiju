name: CI

# The same stages as scripts/ci.sh, which runs them locally.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TOV: ${{ github.workspace }}/build/tov/target/release/tov
  TOV_CFLAGS: -DTV_PLAIN_ALLOC
  # the JavaScriptCore the image links (scripts/build-jsc.sh): every job tests the engine that ships
  TOV_JSC_DIR: ${{ github.workspace }}/build/jsc/current

jobs:
  tov:
    name: Patched Tov compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache key
        id: key
        run: echo "key=ubuntu-24.04-$(scripts/ci.sh tov-key)" >> "$GITHUB_OUTPUT"
      # Keyed on TOV_REV, tov-patches/** and both build scripts. Cache the compiler,
      # engine and runtime source so the C lifetime regression also runs on warm caches.
      - name: Compiler and engine cache
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            build/tov/target/release/tov
            build/jsc
            build/tov/runtime/tov.c
            build/tov/runtime/tov.h
          key: ${{ steps.key.outputs.key }}
      - name: Rust
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
      - name: Engine build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends cmake ninja-build clang lld ruby perl python3 libicu-dev
      - name: Build the compiler and JavaScriptCore
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/ci.sh tov
      - name: String view cache lifetime regression
        run: |
          cc -std=c11 -O1 -ffunction-sections -fdata-sections \
            -I build/tov/runtime tov-patches/tests/string_view_cache.c \
            -Wl,--gc-sections -lm -o build/string-view-cache
          build/string-view-cache

  checks:
    name: Check, unit, OpenAPI, web, parity, config reference, deployments
    needs: tov
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # tests/test_deploy.py fails instead of skipping the chart checks when helm is missing
      REQUIRE_HELM: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          bun: "true"
          objects-key: checks
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.2
      # the ECS module's own test (tests/test_deploy.py runs `terraform init` and `terraform test` when TERRAFORM is set)
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - run: scripts/ci.sh check unit openapi web parity configdoc deploy
        env:
          TERRAFORM: terraform
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checks-logs
          path: |
            build/ci/
            build/*.log
          if-no-files-found: ignore

  e2e:
    name: e2e (${{ matrix.server }})
    needs: tov
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        server: [bun, http1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          go: "true"
          objects-key: e2e-${{ matrix.server }}
      - run: scripts/ci.sh e2e-${{ matrix.server }}
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-${{ matrix.server }}-logs
          path: |
            build/ci/
            build/**/*.log
            !build/tov/**
          if-no-files-found: ignore

  # a memory soak of one worker (tests/soak/soak.py): streamed and plain chat with the log store on, failing when
  # RSS grows or an open stream costs too much; then big request bodies to a worker and a broker
  # (tests/soak/bodies.py); then WebSocket sessions opened and closed on both servers, failing on the RSS slope per
  # session (tests/soak/websockets.py); then small chats on both servers, failing on a per-request RSS slope
  # (tests/soak/slope.py); about ten minutes after the build
  soak:
    name: Memory soak
    needs: tov
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          objects-key: soak
      - run: scripts/ci.sh soak
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soak-logs
          path: |
            build/ci/
            build/soak.gateway.log
            build/soak-bodies.gateway.log
            build/soak-websockets.gateway.log
            build/soak-slope.*.gateway.log
          if-no-files-found: ignore

  ui:
    name: Web UI (Chromium)
    needs: tov
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          python: "false"
          playwright: "true"
          objects-key: ui
      - run: scripts/ci.sh ui
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-logs
          path: |
            build/ci/
            build/*.log
          if-no-files-found: ignore

  # The Dockerfile and the Helm chart against trivy's misconfiguration rules, on every change (under a minute).
  # deploy/terraform is left out until its ECS module defaults to HTTPS and a narrowed ingress (audit P0-1).
  # A config scan needs no vulnerability database, only trivy's checks bundle. Its default home is mirror.gcr.io; when
  # that download fails trivy falls back to the checks built into its binary, so the job does not go red with the
  # mirror but may scan with older checks. The bundle comes from ghcr.io instead (the action caches it per day).
  config-scan:
    name: Scan Dockerfile and chart (trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_CHECKS_BUNDLE_REPOSITORY: ghcr.io/aquasecurity/trivy-checks:2
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: deploy/terraform
          severity: CRITICAL,HIGH
          exit-code: "1"

  # Build and test each architecture locally before publishing on main.
  # Only the final publication job, after every CI lane passes, creates the
  # multi-platform commit tag. Pull requests never log in or publish.
  image:
    name: Docker image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy-image
      # Trivy tries these in order but moves on only after a temporary error. Its default first choice, mirror.gcr.io,
      # answered 404 for the database, which stopped the download (every main build failed so). ghcr.io comes first,
      # then AWS's public mirror: ghcr.io's rate limit is a temporary error, so it falls through.
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1,mirror.gcr.io/aquasec/trivy-java-db:1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build (no push)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: raiju:ci
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # one layer cache per architecture
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          # only main writes the layer cache, so pull requests do not evict it
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope=image-{0}', matrix.arch) || '' }}
      # read-only root filesystem, /tmp a tmpfs, user 65532, no capabilities, the chart's arguments, a setup token:
      # /health, /ready, raiju -healthcheck, Docker's HEALTHCHECK, the setup lock, a chat through a mock upstream,
      # a clean stop on SIGTERM
      - name: Boot smoke
        run: python3 tests/image_smoke.py raiju:ci
      - uses: ./.github/actions/playwright
      - name: Console browser tooling
        run: docker pull python:3.12-slim
      - name: Consolidated console browser proof
        run: |
          for server in bun http1; do
            RAIJU_PREVIEW_SERVER="$server" scripts/check_console.sh raiju:ci
          done
      - name: Console proof logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-proof-logs-${{ matrix.arch }}
          path: |
            build/console-preview.log
            build/console-preview.png
          if-no-files-found: ignore
      # the scan runs even when the smoke failed, so one failure does not hide the other
      - name: Install trivy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1 # v0.2.4
        with:
          version: v0.69.3
          cache: true
      - name: Date
        id: date
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # the database is cached per day, so an outage of every repository falls back to the last one saved
      - name: Restore the vulnerability database
        id: db-cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: trivy-db-${{ runner.os }}-${{ runner.arch }}-${{ steps.date.outputs.day }}
          restore-keys: trivy-db-${{ runner.os }}-${{ runner.arch }}-
      - name: Update the vulnerability database
        id: db
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # trivy skips the download while the cached database is current
          for attempt in 1 2 3; do
            if trivy image --download-db-only; then
              echo "fresh=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::trivy database download failed (attempt $attempt)"
            sleep $((attempt * 20))
          done
          if [ -f "$TRIVY_CACHE_DIR/db/trivy.db" ]; then
            echo "::warning::every trivy database repository failed; scanning with the cached database"
          else
            echo "::error::no trivy database could be downloaded and none is cached"
            exit 1
          fi
      - name: Save the vulnerability database
        if: ${{ !cancelled() && steps.db.outputs.fresh == 'true' && steps.db-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: trivy-db-${{ runner.os }}-${{ runner.arch }}-${{ steps.date.outputs.day }}
      # any critical or high CVE fails the job, fixed upstream or not: no --ignore-unfixed and no .trivyignore, the
      # same bar as the registry scan before a deploy. An unfixed one is resolved in the Dockerfile (another base,
      # or removing the package), not suppressed here.
      - name: Scan the image (trivy)
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: trivy image --skip-db-update --pkg-types os,library --severity CRITICAL,HIGH --exit-code 1 raiju:ci
      - name: Publish tested architecture image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag="$IMAGE:sha-${GITHUB_SHA}-${{ matrix.arch }}"
          docker tag raiju:ci "$tag"
          docker push "$tag"
          docker inspect "$tag" --format '{{index .RepoDigests 0}}' > image-digest-${{ matrix.arch }}.txt
      - name: Save published digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digest-${{ matrix.arch }}
          path: image-digest-${{ matrix.arch }}.txt
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish qualified multi-platform image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, e2e, soak, ui, config-scan, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Publish exact tested digests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          gh run download "$GITHUB_RUN_ID" --pattern 'image-digest-*' --dir digests
          sources=()
          for arch in amd64 arm64; do
            source=$(cat "digests/image-digest-$arch/image-digest-$arch.txt")
            [[ "$source" =~ ^${IMAGE}@sha256:[0-9a-f]{64}$ ]]
            sources+=("$source")
          done
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag="$IMAGE:sha-$GITHUB_SHA"
          docker buildx imagetools create --tag "$tag" "${sources[@]}"
          docker buildx imagetools inspect "$tag" >> "$GITHUB_STEP_SUMMARY"
