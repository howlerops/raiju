name: CI

# The same stages as scripts/ci.sh, which runs them locally.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TOV: ${{ github.workspace }}/build/tov/target/release/tov
  TOV_CFLAGS: -DTV_PLAIN_ALLOC

jobs:
  tov:
    name: Patched Tov compiler
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache key
        id: key
        run: echo "key=$(scripts/ci.sh tov-key)" >> "$GITHUB_OUTPUT"
      # keyed on TOV_REV, tov-patches/** and scripts/build-tov.sh: the binary carries its runtime
      # and the vendored libraries, so it is all the later jobs need
      - name: Compiler cache
        id: cache
        uses: actions/cache@v4
        with:
          path: build/tov/target/release/tov
          key: ${{ steps.key.outputs.key }}
      - name: Rust
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
      - name: Build the compiler
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/ci.sh tov

  checks:
    name: Check, unit, OpenAPI, web, parity
    needs: tov
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          bun: "true"
          objects-key: checks
      - run: scripts/ci.sh check unit openapi web parity
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checks-logs
          path: |
            build/ci/
            build/*.log
          if-no-files-found: ignore

  e2e:
    name: e2e (${{ matrix.server }})
    needs: tov
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        server: [bun, http1]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go: "true"
          objects-key: e2e-${{ matrix.server }}
      - run: scripts/ci.sh e2e-${{ matrix.server }}
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.server }}-logs
          path: |
            build/ci/
            build/**/*.log
            !build/tov/**
          if-no-files-found: ignore

  # a memory soak of one worker (tests/soak/soak.py): streamed and plain chat with the log store on, failing when
  # RSS grows or an open stream costs too much; about two minutes after the build
  soak:
    name: Memory soak
    needs: tov
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          objects-key: soak
      - run: scripts/ci.sh soak
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soak-logs
          path: |
            build/ci/
            build/soak.gateway.log
          if-no-files-found: ignore

  ui:
    name: Web UI (Chromium)
    needs: tov
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python: "false"
          playwright: "true"
          objects-key: ui
      - run: scripts/ci.sh ui
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-logs
          path: |
            build/ci/
            build/*.log
          if-no-files-found: ignore

  image:
    name: Docker image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: raiju:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
