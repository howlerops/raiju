name: CI

# The same stages as scripts/ci.sh, which runs them locally.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TOV: ${{ github.workspace }}/build/tov/target/release/tov
  TOV_CFLAGS: -DTV_PLAIN_ALLOC

jobs:
  tov:
    name: Patched Tov compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache key
        id: key
        run: echo "key=ubuntu-24.04-$(scripts/ci.sh tov-key)" >> "$GITHUB_OUTPUT"
      # keyed on TOV_REV, tov-patches/** and scripts/build-tov.sh: the binary carries its runtime
      # and the vendored libraries, so it is all the later jobs need
      - name: Compiler cache
        id: cache
        uses: actions/cache@v4
        with:
          path: build/tov/target/release/tov
          key: ${{ steps.key.outputs.key }}
      - name: Rust
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
      - name: Build the compiler
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/ci.sh tov

  checks:
    name: Check, unit, OpenAPI, web, parity, config reference, deployments
    needs: tov
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # tests/test_deploy.py fails instead of skipping the chart checks when helm is missing
      REQUIRE_HELM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          bun: "true"
          objects-key: checks
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.2
      - run: scripts/ci.sh check unit openapi web parity configdoc deploy
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checks-logs
          path: |
            build/ci/
            build/*.log
          if-no-files-found: ignore

  e2e:
    name: e2e (${{ matrix.server }})
    needs: tov
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        server: [bun, http1]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go: "true"
          objects-key: e2e-${{ matrix.server }}
      - run: scripts/ci.sh e2e-${{ matrix.server }}
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.server }}-logs
          path: |
            build/ci/
            build/**/*.log
            !build/tov/**
          if-no-files-found: ignore

  # a memory soak of one worker (tests/soak/soak.py): streamed and plain chat with the log store on, failing when
  # RSS grows or an open stream costs too much; then big request bodies to a worker and a broker
  # (tests/soak/bodies.py); then WebSocket sessions opened and closed on both servers, failing on the RSS slope per
  # session (tests/soak/websockets.py); then small chats on both servers, failing on a per-request RSS slope
  # (tests/soak/slope.py); about ten minutes after the build
  soak:
    name: Memory soak
    needs: tov
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          objects-key: soak
      - run: scripts/ci.sh soak
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soak-logs
          path: |
            build/ci/
            build/soak.gateway.log
            build/soak-bodies.gateway.log
            build/soak-websockets.gateway.log
            build/soak-slope.*.gateway.log
          if-no-files-found: ignore

  ui:
    name: Web UI (Chromium)
    needs: tov
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python: "false"
          playwright: "true"
          objects-key: ui
      - run: scripts/ci.sh ui
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-logs
          path: |
            build/ci/
            build/*.log
          if-no-files-found: ignore

  # The Dockerfile and the Helm chart against trivy's misconfiguration rules, on every change (under a minute).
  # deploy/terraform is left out until its ECS module defaults to HTTPS and a narrowed ingress (audit P0-1).
  # A config scan needs no vulnerability database, only trivy's checks bundle. Its default home is mirror.gcr.io; when
  # that download fails trivy falls back to the checks built into its binary, so the job does not go red with the
  # mirror but may scan with older checks. The bundle comes from ghcr.io instead (the action caches it per day).
  config-scan:
    name: Scan Dockerfile and chart (trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_CHECKS_BUNDLE_REPOSITORY: ghcr.io/aquasecurity/trivy-checks:2
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: deploy/terraform
          severity: CRITICAL,HIGH
          exit-code: "1"

  # The image as it ships (built, not pushed), on pull requests and on main: a boot smoke run the way the Helm chart
  # runs it (tests/image_smoke.py), then trivy against known CVEs in its OS packages and the binary.
  image:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy-image
      # Trivy tries these in order but moves on only after a temporary error. Its default first choice, mirror.gcr.io,
      # answered 404 for the database, which stopped the download (every main build failed so). ghcr.io comes first,
      # then AWS's public mirror: ghcr.io's rate limit is a temporary error, so it falls through.
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1,mirror.gcr.io/aquasec/trivy-java-db:1
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: raiju:ci
          cache-from: type=gha
          # only main writes the layer cache, so pull requests do not evict it
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
      # read-only root filesystem, /tmp a tmpfs, user 65532, no capabilities, the chart's arguments, a setup token:
      # /health, /ready, raiju -healthcheck, Docker's HEALTHCHECK, the setup lock, a chat through a mock upstream,
      # a clean stop on SIGTERM
      - name: Boot smoke
        run: python3 tests/image_smoke.py raiju:ci
      # the scan runs even when the smoke failed, so one failure does not hide the other
      - name: Install trivy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1 # v0.2.4
        with:
          version: v0.69.3
          cache: true
      - name: Date
        id: date
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # the database is cached per day, so an outage of every repository falls back to the last one saved
      - name: Restore the vulnerability database
        id: db-cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: trivy-db-${{ runner.os }}-${{ steps.date.outputs.day }}
          restore-keys: trivy-db-${{ runner.os }}-
      - name: Update the vulnerability database
        id: db
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # trivy skips the download while the cached database is current
          for attempt in 1 2 3; do
            if trivy image --download-db-only; then
              echo "fresh=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::trivy database download failed (attempt $attempt)"
            sleep $((attempt * 20))
          done
          if [ -f "$TRIVY_CACHE_DIR/db/trivy.db" ]; then
            echo "::warning::every trivy database repository failed; scanning with the cached database"
          else
            echo "::error::no trivy database could be downloaded and none is cached"
            exit 1
          fi
      - name: Save the vulnerability database
        if: ${{ !cancelled() && steps.db.outputs.fresh == 'true' && steps.db-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: trivy-db-${{ runner.os }}-${{ steps.date.outputs.day }}
      # a fixable critical or high CVE fails the job
      - name: Scan the image (trivy)
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: trivy image --skip-db-update --pkg-types os,library --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 raiju:ci
