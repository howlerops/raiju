name: Staging validation

# Runs tests/staging against a deployed gateway (docs/staging-validation.md). Started by hand only: never on push or
# pull request. Credentials come from the GitHub environment named "staging" (its secrets, and its protection rules
# if it has any); nothing runs without a base URL.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "The gateway as clients reach it (https://raiju-staging.example.com); its host must be in the staging environment variable RAIJU_STAGING_HOSTS"
        required: true
        type: string
      checks:
        description: "Comma-separated: smoke, creates, trickle, declared, dcr, soak, cluster, watch, bridge, or all (smoke,creates,trickle,declared,dcr)"
        required: true
        default: smoke
        type: string
      soak_duration:
        description: "Length of the soak check (this workflow stops at 6 h on every runner; run 24 h soaks directly from an operator host)"
        required: false
        default: 30m
        type: string
      runner:
        description: "Runner label (a self-hosted runner inside the VPC for cluster, watch and bridge, which need the nodes' private addresses)"
        required: false
        default: ubuntu-24.04
        type: string

permissions:
  contents: read

concurrency:
  group: staging-${{ inputs.base_url }}
  cancel-in-progress: false

jobs:
  staging:
    name: Staging checks (${{ inputs.checks }})
    if: ${{ inputs.base_url != '' && inputs.checks != '' }}
    runs-on: ${{ inputs.runner }}
    environment: staging
    timeout-minutes: 360
    env:
      RAIJU_BASE_URL: ${{ inputs.base_url }}
      RAIJU_ADMIN_TOKEN: ${{ secrets.RAIJU_ADMIN_TOKEN }}
      RAIJU_VKS: ${{ secrets.RAIJU_VKS }}
      RAIJU_MODEL: ${{ vars.RAIJU_MODEL }}
      RAIJU_SMOKE_MODELS: ${{ vars.RAIJU_SMOKE_MODELS }}
      RAIJU_METRICS_TOKEN: ${{ secrets.RAIJU_METRICS_TOKEN }}
      RAIJU_SETUP_TOKEN: ${{ secrets.RAIJU_SETUP_TOKEN }}
      RAIJU_NODE_URLS: ${{ vars.RAIJU_NODE_URLS }}
      RAIJU_CLUSTER_SECRET: ${{ secrets.RAIJU_CLUSTER_SECRET }}
      RAIJU_OLD_URL: ${{ vars.RAIJU_OLD_URL }}
      RAIJU_NEW_URL: ${{ vars.RAIJU_NEW_URL }}
      RAIJU_RSS_CMD: ${{ vars.RAIJU_RSS_CMD }}
      RAIJU_RSS_METRIC: ${{ vars.RAIJU_RSS_METRIC }}
    steps:
      - name: Inputs
        env:
          CHECKS: ${{ inputs.checks }}
          ALLOWED_HOSTS: ${{ vars.RAIJU_STAGING_HOSTS }}
        run: |
          # The job's secrets (admin token, virtual keys, setup token, cluster secret) are sent to base_url, so it
          # must be TLS and a host the staging environment names: whoever can start this workflow cannot point it
          # at a host of their own.
          case "$RAIJU_BASE_URL" in
            https://*) ;;
            *) echo "base_url must start with https://"; exit 1 ;;
          esac
          host=${RAIJU_BASE_URL#https://}
          host=${host%%[/?#]*}
          case "$host" in
            ""|*@*|*[!A-Za-z0-9.:-]*) echo "base_url must be https://host[:port] with no credentials"; exit 1 ;;
          esac
          if [ -z "$ALLOWED_HOSTS" ]; then
            echo "set the staging environment variable RAIJU_STAGING_HOSTS (comma-separated host[:port] values base_url may name)"
            exit 1
          fi
          case ",$(printf %s "$ALLOWED_HOSTS" | tr -d ' ')," in
            *",$host,"*) ;;
            *) echo "base_url host $host is not in RAIJU_STAGING_HOSTS"; exit 1 ;;
          esac
          case "$CHECKS" in
            *[!a-z,]*) echo "checks is a comma-separated list of check names"; exit 1 ;;
          esac
          echo "Running $CHECKS against $RAIJU_BASE_URL"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the checks
        env:
          CHECKS: ${{ inputs.checks }}
          SOAK_DURATION: ${{ inputs.soak_duration }}
        run: python3 tests/staging/run.py --checks "$CHECKS" --soak-duration "$SOAK_DURATION" --out staging-results
      - name: Summary
        if: always()
        run: |
          if [ -f staging-results/summary.md ]; then cat staging-results/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-results
          path: staging-results/
          if-no-files-found: ignore
