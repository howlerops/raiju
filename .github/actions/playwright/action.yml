name: Playwright and Chromium
description: >
  Node, the pinned Playwright and its Chromium, for the jobs that drive the console in a browser. The browser
  download is cached by the Playwright version; its system packages are installed either way.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22"
    - name: Browser cache
      id: browsers
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-1.56.1
    - name: Playwright
      shell: bash
      run: npm install -g playwright@1.56.1
    - if: steps.browsers.outputs.cache-hit != 'true'
      name: Chromium
      shell: bash
      run: playwright install --with-deps chromium
    # the browser came from the cache: only the system libraries it needs are missing
    - if: steps.browsers.outputs.cache-hit == 'true'
      name: Chromium system packages
      shell: bash
      run: playwright install-deps chromium
