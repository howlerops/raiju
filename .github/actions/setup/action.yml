name: Raiju test setup
description: >
  The patched Tov compiler and the JavaScriptCore programs link (node:* modules run on it), both from the cache
  the tov job filled, Tov's compiled-object cache, and the tools the chosen stages need.
inputs:
  python:
    description: Python 3.13 and the test packages
    default: "true"
  bun:
    description: Bun (web-check)
    default: "false"
  go:
    description: Go (the A2A gRPC client in e2e)
    default: "false"
  playwright:
    description: Node, Playwright and Chromium (make ui)
    default: "false"
  objects-key:
    description: Name for this job's cache of Tov's compiled runtime and libraries
    required: true
runs:
  using: composite
  steps:
    - name: System packages
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends pkg-config libicu-dev

    - name: Compiler cache key
      id: key
      shell: bash
      run: echo "key=ubuntu-24.04-$(scripts/ci.sh tov-key)" >> "$GITHUB_OUTPUT"

    - name: Restore the patched compiler and the engine
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          build/tov/target/release/tov
          build/jsc
          build/tov/runtime/tov.c
          build/tov/runtime/tov.h
        key: ${{ steps.key.outputs.key }}
        fail-on-cache-miss: true

    # BoringSSL, WAMR, libdatachannel, nghttp2 and the runtime compile on a machine's first build
    # (into ~/.cache/tov/c); reusing them saves several minutes per job.
    - name: Tov object cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cache/tov/c/vendor*
          ~/.cache/tov/c/tls*
          ~/.cache/tov/c/rtc*
          ~/.cache/tov/c/rt*
          ~/.cache/tov/c/js*
          ~/.cache/tov/c/node*
          ~/.cache/tov/c/napi*
        key: tov-objects-${{ inputs.objects-key }}-${{ steps.key.outputs.key }}

    - if: inputs.python == 'true'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: tests/requirements.txt
    - if: inputs.python == 'true'
      name: Python packages
      shell: bash
      run: python -m pip install --quiet -r tests/requirements.txt

    - if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.4.2"

    - if: inputs.go == 'true'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: "1.26.9"
        cache-dependency-path: tests/a2a_grpc_client/go.sum

    - if: inputs.playwright == 'true'
      uses: ./.github/actions/playwright
