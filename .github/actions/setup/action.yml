name: Raiju test setup
description: >
  The patched Tov compiler from the cache the tov job filled, JavaScriptCore (node:* modules link
  it), Tov's compiled-object cache, and the tools the chosen stages need.
inputs:
  python:
    description: Python 3.13 and the test packages
    default: "true"
  bun:
    description: Bun (web-check)
    default: "false"
  go:
    description: Go (the A2A gRPC client in e2e)
    default: "false"
  playwright:
    description: Node, Playwright and Chromium (make ui)
    default: "false"
  objects-key:
    description: Name for this job's cache of Tov's compiled runtime and libraries
    required: true
runs:
  using: composite
  steps:
    - name: System packages
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends pkg-config libjavascriptcoregtk-4.1-dev

    - name: Compiler cache key
      id: key
      shell: bash
      run: echo "key=ubuntu-24.04-$(scripts/ci.sh tov-key)" >> "$GITHUB_OUTPUT"

    - name: Restore the patched compiler
      uses: actions/cache/restore@v4
      with:
        path: build/tov/target/release/tov
        key: ${{ steps.key.outputs.key }}
        fail-on-cache-miss: true

    # BoringSSL, WAMR, libdatachannel, nghttp2 and the runtime compile on a machine's first build
    # (into ~/.cache/tov/c); reusing them saves several minutes per job.
    - name: Tov object cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/tov/c/vendor*
          ~/.cache/tov/c/tls*
          ~/.cache/tov/c/rtc*
          ~/.cache/tov/c/rt*
          ~/.cache/tov/c/js*
          ~/.cache/tov/c/node*
          ~/.cache/tov/c/napi*
        key: tov-objects-${{ inputs.objects-key }}-${{ steps.key.outputs.key }}

    - if: inputs.python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - if: inputs.python == 'true'
      name: Python packages
      shell: bash
      run: python -m pip install --quiet pyyaml grpcio protobuf h2 numpy scipy

    - if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.4.2"

    - if: inputs.go == 'true'
      uses: actions/setup-go@v5
      with:
        go-version: "1.26.9"
        cache-dependency-path: tests/a2a_grpc_client/go.sum

    - if: inputs.playwright == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - if: inputs.playwright == 'true'
      name: Playwright and Chromium
      shell: bash
      run: |
        npm install -g playwright@1.56.1
        playwright install --with-deps chromium
