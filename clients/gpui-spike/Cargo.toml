[package]
name = "raiju-gpui-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3"
gpui = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = "0.24"
ureq = { version = "2", default-features = false }

# xattr 0.2.3 uses libc::ENOATTR, which libc 0.2.182+ (required by rustix here) no longer defines on Linux.
# vendor/xattr is the same crate with ENOATTR = ENODATA on Linux.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
