# Scrape config for the metrics profile in docker-compose.yml. The target is
# the raiju service name on the compose network. Bifrost metric names are
# served on /metrics.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: raiju
    metrics_path: /metrics
    static_configs:
      - targets: ["raiju:8080"]
