{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "raiju.fullname" . }}
  labels:
    {{- include "raiju.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # one Service per pod set: the main Service, or the peers Service when /metrics is on the cluster port
  selector:
    matchLabels:
      {{- include "raiju.selectorLabels" . | nindent 6 }}
    matchExpressions:
      {{- if include "raiju.metricsOnCluster" . }}
      - key: app.kubernetes.io/component
        operator: In
        values: [peers]
      {{- else }}
      - key: app.kubernetes.io/component
        operator: NotIn
        values: [peers]
      {{- end }}
  endpoints:
    - port: {{ if include "raiju.metricsOnCluster" . }}cluster{{ else }}http{{ end }}
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      {{- with .Values.metricsToken.existingSecret }}
      bearerTokenSecret:
        name: {{ . }}
        key: {{ $.Values.metricsToken.key }}
      {{- end }}
{{- end }}
