apiVersion: v1
kind: Service
metadata:
  name: {{ include "raiju.fullname" . }}
  labels:
    {{- include "raiju.labels" . | nindent 4 }}
  {{- if or .Values.service.annotations .Values.prometheus.annotations }}
  annotations:
    {{- if .Values.prometheus.annotations }}
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ if include "raiju.metricsOnCluster" . }}{{ include "raiju.clusterPort" . | quote }}{{ else }}{{ .Values.service.port | quote }}{{ end }}
    prometheus.io/path: /metrics
    {{- end }}
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "raiju.selectorLabels" . | nindent 4 }}
