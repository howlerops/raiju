{{- if .Values.peers.headlessService }}
# One A record per pod, for config.cluster.discovery {"type": "dns", "dns_names": ["<this name>"]}. Pods that are
# not ready yet are listed too, so a starting node finds its peers.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "raiju.fullname" . }}-peers
  labels:
    {{- include "raiju.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "raiju.selectorLabels" . | nindent 4 }}
{{- end }}
