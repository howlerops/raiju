{{- if or .Values.peers.headlessService (include "raiju.clusterPort" .) }}
# One A record per pod, for config.cluster.discovery {"type": "dns", "dns_names": ["<this name>"]}. Pods that are
# not ready yet are listed too, so a starting node finds its peers. With a cluster listener (cluster.listenPort) the
# peer routes are served on that port only, and this Service targets it.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "raiju.fullname" . }}-peers
  labels:
    {{- include "raiju.labels" . | nindent 4 }}
    app.kubernetes.io/component: peers
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    {{- with include "raiju.clusterPort" . }}
    - name: cluster
      port: {{ . }}
      targetPort: cluster
      protocol: TCP
    {{- else }}
    - name: http
      port: {{ .Values.port }}
      targetPort: http
      protocol: TCP
    {{- end }}
  selector:
    {{- include "raiju.selectorLabels" . | nindent 4 }}
{{- end }}
