{{- if and (not .Values.existingSecret) (not (empty .Values.providerSecrets)) }}
{{- range $name, $value := .Values.providerSecrets }}
{{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $name) }}
{{- fail (printf "providerSecrets: %q is not a valid environment variable name" $name) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "raiju.secretName" . }}
  labels:
    {{- include "raiju.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.providerSecrets }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
