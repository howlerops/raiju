apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "raiju.configMapName" . }}
  labels:
    {{- include "raiju.labels" . | nindent 4 }}
data:
  # Mounted at /app/data/config.json (-app-dir /app/data). Holds no secrets:
  # provider keys are "env.NAME" references resolved from the Secret.
  config.json: |-
    {{- toJson .Values.config | nindent 4 }}
