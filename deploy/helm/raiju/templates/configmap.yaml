apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "raiju.configMapName" . }}
  labels:
    {{- include "raiju.labels" . | nindent 4 }}
data:
  # Copied to /app/data/config.json by the pod's init container (configMode). Holds no secrets:
  # provider keys are "env.NAME" references resolved from the Secret.
  config.json: |-
    {{- include "raiju.config" . | nindent 4 }}
