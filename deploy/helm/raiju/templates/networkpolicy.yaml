{{- if .Values.networkPolicy.enabled }}
# Ingress to the gateway's pods, for clusters whose network plugin enforces NetworkPolicy. The HTTP port takes
# traffic from networkPolicy.ingressFrom (every source when empty); the cluster listener, which only peers use,
# takes it from this release's own pods alone. Egress is not restricted: the gateway calls providers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "raiju.fullname" . }}
  labels:
    {{- include "raiju.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "raiju.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if include "raiju.clusterPort" . }}
    - ports:
        - port: cluster
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "raiju.selectorLabels" . | nindent 14 }}
    {{- end }}
{{- end }}
