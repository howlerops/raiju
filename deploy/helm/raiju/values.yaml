# Default values for raiju.

replicaCount: 1

image:
  # Build the image from the repo root (`docker build -t raiju .`), push it to a
  # registry, and set repository to that registry path.
  repository: raiju
  # Empty means Chart.AppVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Passed to the gateway as -workers. Each worker is a process with its own
# in-memory budgets, rate limits, cache and metrics (see deploy/README.md).
workers: 1

# Port the gateway listens on inside the pod (-port) and the Service targets.
port: 8080

# The whole config.json, as a YAML map. Rendered into a ConfigMap and mounted at
# /app/data/config.json. Do not put secrets here: refer to them as "env.NAME"
# and set NAME in providerSecrets (or an existing Secret).
config:
  client:
    enable_logging: true
    drop_excess_requests: false
  providers:
    openai:
      keys:
        - name: openai-1
          value: env.OPENAI_API_KEY
          models: []
          weight: 1
    anthropic:
      keys:
        - name: anthropic-1
          value: env.ANTHROPIC_API_KEY
          models: []
          weight: 1
    gemini:
      keys:
        - name: gemini-1
          value: env.GEMINI_API_KEY
          models: []
          weight: 1
  cache:
    enabled: false

# Provider API keys, as a map of environment variable name to value. Rendered
# into a Secret and injected with envFrom, so config's "env.NAME" resolves.
# Names must be valid environment variable names. Values are stored in the
# Secret and in the Helm release history: for production, prefer existingSecret.
# The management API is locked until an admin exists: add BIFROST_SETUP_TOKEN
# here (or to existingSecret) and create the first admin with it
# (POST /api/users with the token in X-Bifrost-Setup-Token).
providerSecrets: {}
#  OPENAI_API_KEY: sk-...
#  BIFROST_SETUP_TOKEN: <a long random value>

# Name of a Secret that already exists in the namespace. Its keys are injected
# with envFrom. When set, providerSecrets is not rendered.
existingSecret: ""

service:
  type: ClusterIP
  port: 8080
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 64Mi
  limits:
    memory: 256Mi

# Seconds Kubernetes waits after SIGTERM before it kills the pod. Raiju drains on SIGTERM: /ready answers 503, the
# listener closes after server.shutdown_delay_seconds (0 by default; 5 lets the endpoints update first), the requests
# in hand get up to server.shutdown_grace_seconds (25 by default), and queued exports get about 5 s.
terminationGracePeriodSeconds: 35

# liveness on /health, readiness on /ready
probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5

podAnnotations: {}

# Adds prometheus.io/scrape, port and path annotations to the Pod and Service,
# for Prometheus setups that discover targets from annotations.
prometheus:
  annotations: true

# Requires the Prometheus Operator CRDs (monitoring.coreos.com/v1).
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# Scales on CPU. Replicas do not share state, so budgets and rate limits are
# enforced per pod, not across the fleet.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
