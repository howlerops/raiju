  /api/adaptive-routing/history/issues:
    get:
      tags:
      - Governance
      summary: The adaptive routing incidents open in a window, filtered, sorted and paged
      description: >-
        from and to bound the window (RFC 3339, or unix seconds); an incident is in it when it was open at some point
        there. statuses (attention, recovering, resolved) filters, and sort orders (priority, newest, oldest, longest,
        shortest). limit (default 25, at most 100) and offset page the result; without either, every match is returned.
        matched_summary covers every match, not the page. resolved_at is absent while an incident is open. Incidents are
        kept in memory for the life of the process.
      operationId: listApiAdaptiveRoutingHistoryIssues
      x-raiju-permission: read
      x-raiju-resource: Observability
      x-raiju-operation: View
      x-raiju-roles: [admin, editor, viewer]
      x-raiju-gate: 'RBAC: read'
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
        - name: statuses
          in: query
          required: false
          schema:
            type: string
            description: Comma-separated attention, recovering and resolved.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [priority, newest, oldest, longest, shortest]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                  offset:
                    type: integer
                  matched_summary:
                    type: object
                    properties:
                      attention:
                        type: integer
                      recovering:
                        type: integer
                      resolved:
                        type: integer
                      median_resolve_seconds:
                        type: integer
                        nullable: true
                      longest_ongoing_seconds:
                        type: integer
        '400':
          description: A bad window, sort, status filter, limit or a negative offset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '401':
          description: Authentication required, or the session or token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
