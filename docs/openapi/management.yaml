              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
  /api/oauth/config/{id}/status:
    get:
      tags:
      - MCP gateway
      summary: Get OAuth config status
      description: The status of an OAuth config, which is the MCP client of auth type oauth with that name. authorized when
        it holds a token, failed when its last verification flow failed and it holds none, pending otherwise. With flow_id
        (the flow_id of an initiate-verification or reauthorize answer) the status is that flow's, as Bifrost's
        resolveOAuthFlowPollStatus answers it. pending until the callback (expired after the flow's deadline), failed when
        the authorization server refused it or the token request failed, and once the flow is done the config's status
        (authorized), or expired when it ended without one. A flow of another config is 404.
      operationId: getApiOauthConfigIdStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Name of the OAuth config (MCP client)
      - name: flow_id
        in: query
        required: false
        schema:
          type: string
        description: A verification flow of this config, to read that flow's status
      x-raiju-permission: read
      x-raiju-resource: MCPGateway
      x-raiju-operation: View
      x-raiju-roles:
      - admin
      - editor
      - viewer
      x-raiju-gate: 'RBAC: read (custom roles need MCPGateway / View)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum:
                    - pending
                    - authorized
                    - failed
                    - expired
                  flow_id:
                    type: string
                    description: The flow asked about (with flow_id only)
                  flow_status:
                    type: string
                    description: The flow's own state while it is held (pending or failed; with flow_id only)
                  token_expires_at:
                    type: string
                    format: date-time
                    description: When the access token expires (authorized only, when known)
        '404':
          description: No such OAuth config, or the flow belongs to another config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
  /api/oauth2/consent/flows/{id}:
    get:
      tags:
      - MCP gateway
      summary: Read an MCP authorization request on the consent page (the client, its redirect URI and expiry)
      description: The request is the one the MCP authorization server's /oauth2/authorize stored. Its consent temp token
        (the fragment after the hash, t=, of the consent link) is sent in the X-Bifrost-Temp-Token header. The modes offered
        are listed in the available_modes field. "vk" (unless oauth2_server_config.disable_vk_identity is set while user
        mode is available), "session" for a dashboard user signed in on this request while inference auth is not enforced,
        and "user" while the gateway's OIDC sign-in is on. logged_in_user (id, name) names the identity-provider user whose
        single sign-on session token is sent as the Authorization bearer, so the page can offer to continue as that user;
        the consent page sends its user to /api/oidc/login?return_to=... to sign in.
      operationId: getApiOauth2ConsentFlowsId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The authorization request's id
      - name: X-Bifrost-Temp-Token
        in: header
        required: true
        schema:
          type: string
        description: The consent temp token of this request
      security: []
      x-raiju-permission: none
      x-raiju-gate: 'the consent temp token of this request (client.mcp_server_auth_mode both or oauth)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '401':
          description: The consent link is invalid or has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '410':
          description: The request has already been completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
    put:
      tags:
      - MCP gateway
      summary: Approve an MCP authorization request with a virtual key, as the signed-in dashboard user or as the signed-in identity-provider user, and answer the client's redirect URL with a one-time code
      description: 'Body {"mode": "vk", "value": "<virtual key>"}. The key must be active and unexpired, and its current value
        (not a rotated one). A key that belongs to a user (its user_id) grants user mode for that user while user mode is
        available, and only to that user signed in (400 otherwise). Body {"mode": "session"} approves as the dashboard user
        signed in on this request: the token then names a new session id and runs without a key (refused with 401 without
        that sign-in, and with 400 while inference auth is enforced). Body {"mode": "user"} approves as the identity-provider
        user whose single sign-on session token is the Authorization bearer (400 without one): the token''s sub is that
        user and bf_mode is user. The redirect URL carries code, state and iss (RFC 9207); the client exchanges the code at /oauth2/token.'
      operationId: putApiOauth2ConsentFlowsId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The authorization request's id
      - name: X-Bifrost-Temp-Token
        in: header
        required: true
        schema:
          type: string
        description: The consent temp token of this request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                  - vk
                  - session
                  - user
                value:
                  type: string
                  description: The virtual key's value (mode vk only)
      security: []
      x-raiju-permission: none
      x-raiju-gate: 'the consent temp token of this request (client.mcp_server_auth_mode both or oauth)'
      responses:
        '200':
          description: OK, with the redirect URL of the client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '400':
          description: The mode or the key is not usable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '401':
          description: The consent link is invalid or has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '410':
          description: The request has already been completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
