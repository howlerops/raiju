components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: An admin user's name and password.
    bearerAuth:
      type: http
      scheme: bearer
      description: A user token, or a session token (sk-sess-...).
  schemas:
    McpLibraryEntry:
      description: One MCP server of the library (Bifrost's mcp_library row)
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        connection_type:
          type: string
          enum: [http, stdio, sse]
        connection_url:
          type: string
        stdio_config:
          type: object
        auth_type:
          type: string
        required_header_keys:
          type: array
          items:
            type: string
        icon_url:
          type: string
        docs_url:
          type: string
        publisher:
          type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
        source:
          type: string
          enum: [remote, custom]
        created_at:
          type: string
        updated_at:
          type: string
    CrewPart:
      type: object
      description: One role of a crew and the candidate that plays it.
      properties:
        role:
          type: string
        candidate:
          type: string
      required:
      - role
      - candidate
    CrewCandidate:
      type: object
      description: A candidate of a pool, with its price per token (USD) from the pricing table.
      properties:
        id:
          type: string
        model:
          type: string
        provider:
          type: string
        route:
          type: string
          enum:
          - api
          - local
          - subscription
        roles:
          type: array
          items:
            type: string
        subscription:
          type: string
        reasoning_effort:
          type: string
        price:
          type: object
          properties:
            input:
              type: number
            output:
