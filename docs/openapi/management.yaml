      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: User name
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
        description: Access profile id
      - name: budget_id
        in: path
        required: true
        schema:
          type: string
        description: The profile's budget id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: '{amount: number greater than 0, mode: "forever" or "cycles", cycles: whole number from 1 to 1000 (cycles mode; default 1)}'
      x-raiju-permission: write
      x-raiju-resource: Users
      x-raiju-operation: Update
      x-raiju-roles: [admin]
      x-raiju-gate: 'RBAC: write (custom roles need Users / Update)'
