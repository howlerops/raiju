  /api/oauth/per-user/flows/{id}:
    get:
      tags:
      - MCP gateway
      summary: Read a per-user OAuth consent flow (its client, the caller it is for and its expiry)
      description: The flow is the consent link a caller was given. Its temp token (client.mcp_enable_temp_token_auth) is
        sent in the X-Bifrost-Temp-Token header in place of a dashboard session; it opens the flow until the flow ends. The
        answer has id, flow_mode (vk, session or user), status, mcp_client, user_id, virtual_key_id, session_id, expires_at,
        created_at and has_active_token. A user-mode flow (opened by a user-mode MCP token) has no temp token and opens only
        for its own user signed in through the gateway's OIDC sign-in, whatever that user's role (403 for anyone else).
        404 when the flow is unknown or expired. Flows are kept in mcp-flow-state.json beside config.json, so a restart
        keeps them.
      operationId: getApiOauthPerUserFlowsId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The consent flow's id
      - name: X-Bifrost-Temp-Token
        in: header
        required: false
        schema:
          type: string
        description: The flow's temp token, when client.mcp_enable_temp_token_auth is on
      x-raiju-permission: read
      x-raiju-resource: MCPGateway
      x-raiju-operation: View
      x-raiju-roles:
      - admin
      x-raiju-gate: 'RBAC: read (custom roles need MCPGateway / View), or the flow''s temp token'
      responses:
