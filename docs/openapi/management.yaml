  /api/adaptive-routing/held-keys:
    get:
      tags:
      - Governance
      summary: The keys and models held out of rotation by a provider's refusal, with the reason, the wait and the next check
      description: >-
        A refusal that repeats until something changes (a rejected credential, an account out of quota, a model the key cannot
        reach or that was retired, a region block, a rate limit) holds the key, or the one model, out of rotation. The wait
        climbs 30 seconds, 60 seconds and so on up to a cap for the class, or is the provider's own hint (never under 10 seconds).
        When the wait runs out, the next request is the check. state is held while the wait runs, checking while the check is
        in flight and due once it can be checked. target is "provider#key", or "provider#key@model" for one model.
      operationId: listApiAdaptiveRoutingHeldKeys
      x-raiju-permission: read
      x-raiju-resource: Observability
      x-raiju-operation: View
      x-raiju-roles: [admin, editor, viewer]
      x-raiju-gate: 'RBAC: read'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  held_keys:
                    type: array
                    items:
                      type: object
                      properties:
                        target:
                          type: string
                        provider:
                          type: string
                        key_id:
                          type: string
                        model:
                          type: string
                          description: The model held, or empty when the whole key is held.
                        state:
                          type: string
                          enum: [held, checking, due]
                        failure_class:
                          type: string
                          enum: [credential, quota, model_access, model_gone, region_blocked, rate_limit]
                        reason:
                          type: string
                          description: The provider's own message.
                        held_since:
                          type: string
                        next_check_at:
                          type: string
                        wait_seconds:
                          type: integer
                        rung:
                          type: integer
                          description: How many failed checks the hold has had (the ladder's step).
                  total:
                    type: integer
        '401':
          description: Authentication required, or the session or token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
