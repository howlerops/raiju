                          enum: [key, route]
                        failure_class:
                          type: string
                          description: The refusal's class, or failures for a circuit that failures opened.
                        reason:
                          type: string
                        status:
                          type: string
                          enum: [attention, recovering, resolved]
                        opened_at:
                          type: string
                        resolved_at:
                          type: string
