  /api/oauth2/consent/flows/{id}:
    get:
      tags:
      - MCP gateway
      summary: Read an MCP authorization request on the consent page (the client, its redirect URI and expiry)
      description: The request is the one the MCP authorization server's /oauth2/authorize stored. Its consent temp token
        (the fragment after the hash, t=, of the consent link) is sent in the X-Bifrost-Temp-Token header. The modes offered
        are listed in the available_modes field, which lists "vk", and "session" for a dashboard user signed in on this request while inference
        auth is not enforced. The user mode is not offered (no identity provider).
      operationId: getApiOauth2ConsentFlowsId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The authorization request's id
      - name: X-Bifrost-Temp-Token
        in: header
        required: true
        schema:
          type: string
        description: The consent temp token of this request
      security: []
      x-raiju-permission: none
      x-raiju-gate: 'the consent temp token of this request (client.mcp_server_auth_mode both or oauth)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '401':
          description: The consent link is invalid or has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '410':
          description: The request has already been completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
    put:
      tags:
      - MCP gateway
      summary: Approve an MCP authorization request with a virtual key (or as the signed-in dashboard user) and answer the client's redirect URL with a one-time code
      description: 'Body {"mode": "vk", "value": "<virtual key>"}. The key must be active and unexpired, and its current value
        (not a rotated one). Body {"mode": "session"} approves as the dashboard user signed in on this request: the token then
        names a new session id and runs without a key (refused with 401 without that sign-in, and with 400 while inference
        auth is enforced). The redirect URL carries code, state and iss (RFC 9207); the client exchanges the code at /oauth2/token.'
      operationId: putApiOauth2ConsentFlowsId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The authorization request's id
      - name: X-Bifrost-Temp-Token
        in: header
        required: true
        schema:
          type: string
        description: The consent temp token of this request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                  - vk
                  - session
                value:
                  type: string
                  description: The virtual key's value (mode vk only)
      security: []
      x-raiju-permission: none
      x-raiju-gate: 'the consent temp token of this request (client.mcp_server_auth_mode both or oauth)'
      responses:
        '200':
          description: OK, with the redirect URL of the client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '400':
          description: The mode or the key is not usable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '401':
          description: The consent link is invalid or has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '410':
          description: The request has already been completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
  /api/oauth2/sessions:
    get:
      tags:
      - MCP gateway
      summary: List the live MCP OAuth grants of the authorization server (the refresh tokens not revoked)
      description: 'Each row has id (the SHA-256 of the grant''s current refresh token), client_id, client_name, bf_mode (vk or
        session), bf_sub (the virtual key''s id, or the session id), bf_sub_display (the key''s name for vk), scope, created_at
        and last_used_at (RFC 3339). Newest first. q matches the client''s name or id and the bound identity; bf_mode,
        virtual_key_id and user_id are comma-separated lists. Paged by limit (default 50, at most 500) and offset.'
      operationId: getApiOauth2Sessions
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: bf_mode
        in: query
        required: false
        schema:
          type: string
          description: A comma-separated list of user, vk and session
      - name: virtual_key_id
        in: query
        required: false
        schema:
          type: string
      - name: user_id
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        schema:
          type: integer
      x-raiju-permission: read
      x-raiju-resource: MCPGateway
      x-raiju-operation: View
      x-raiju-roles:
      - admin
      x-raiju-gate: 'RBAC: read (custom roles need MCPGateway / View)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '400':
          description: A bf_mode, limit or offset is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '405':
          description: Only GET is served here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
  /api/oauth2/sessions/{id}:
