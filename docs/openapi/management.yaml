      x-raiju-gate: 'RBAC: read (custom roles need RBAC / View)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    $ref: '#/components/schemas/CustomRole'
        '404':
          description: No such role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
    put:
      tags:
      - Roles and users
      summary: 'Update a role by its id. A partial update: a field left out keeps its value, and an empty description clears it. A role cannot be renamed. A built-in role (9001 to 9004) is edited as in Bifrost: its description, dac, entity_dac and permissions change, it keeps its id and is_system_role, and it is then judged by its permissions; the admin role must keep RBAC View and Update.'
      operationId: putApiGovernanceRbacRolesRoleId
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: integer
        description: The role's id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomRole'
      x-raiju-permission: write
      x-raiju-resource: RBAC
      x-raiju-operation: Update
      x-raiju-roles:
      - admin
      x-raiju-gate: 'RBAC: write (custom roles need RBAC / Update)'
      responses:
        '200':
          description: The role after the change
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    $ref: '#/components/schemas/CustomRole'
        '400':
          description: The body is invalid, or it renames the role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '404':
          description: No such role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
    delete:
      tags:
      - Roles and users
      summary: Delete a custom role by its id. Refused while a user holds it; access profiles attached to it let go of it. A built-in role cannot be deleted (403).
      operationId: deleteApiGovernanceRbacRolesRoleId
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: integer
        description: The role's id
      x-raiju-permission: write
      x-raiju-resource: RBAC
      x-raiju-operation: Delete
      x-raiju-roles:
      - admin
      x-raiju-gate: 'RBAC: write (custom roles need RBAC / Delete)'
      responses:
        '200':
          description: The role is deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: No such role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '409':
