        in: query
        required: false
        description: 'Page number (1 and up); the offset is (page - 1) x limit'
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        description: 'The next_cursor of the page before: the page starts after that event'
        schema:
          type: string
      - name: search
        in: query
        required: false
        description: 'Free text, ignoring case: initiator, action, target, path, method, outcome and client address'
        schema:
          type: string
      - name: actions
        in: query
        required: false
        description: 'JSON array of CADF actions (create, update, delete, authenticate, access) or Raiju action names; any of them'
        schema:
          type: string
      - name: outcome
        in: query
        required: false
        description: 'One outcome: success (an answer below 400) or failure'
        schema:
          type: string
      - name: outcomes
        in: query
        required: false
        description: 'JSON array of outcomes; any of them'
        schema:
          type: string
      - name: event_type
        in: query
        required: false
        description: 'One event type; every Raiju event is activity'
        schema:
          type: string
      - name: event_types
        in: query
        required: false
        description: 'JSON array of event types'
        schema:
          type: string
      - name: initiator_id
        in: query
        required: false
        description: 'One initiator (the actor)'
        schema:
          type: string
      - name: initiator_ids
        in: query
        required: false
        description: 'JSON array of initiators'
        schema:
          type: string
      - name: initiator_type
        in: query
        required: false
        description: 'One initiator type: user, api_key, session or system'
        schema:
          type: string
      - name: initiator_types
        in: query
        required: false
        description: 'JSON array of initiator types'
        schema:
          type: string
      - name: target_id
        in: query
        required: false
        description: 'One target (the object acted on, else the path)'
        schema:
          type: string
      - name: target_ids
        in: query
        required: false
        description: 'JSON array of targets'
        schema:
          type: string
      - name: target_type
        in: query
        required: false
        description: 'One target type (provider, virtual_key, team, customer, plugin, config, ...)'
        schema:
          type: string
      - name: target_types
        in: query
        required: false
        description: 'JSON array of target types'
        schema:
          type: string
      - name: request_method
        in: query
        required: false
        description: 'One HTTP method'
        schema:
          type: string
      - name: request_methods
        in: query
        required: false
        description: 'JSON array of HTTP methods'
        schema:
          type: string
      - name: request_path
        in: query
        required: false
        description: 'One path prefix'
        schema:
          type: string
      - name: request_paths
        in: query
        required: false
        description: 'JSON array of path prefixes'
        schema:
          type: string
      - name: request_ip
        in: query
        required: false
        description: 'One client address (ignored with omit_ip_addresses)'
        schema:
          type: string
      - name: request_ips
        in: query
        required: false
        description: 'JSON array of client addresses'
        schema:
          type: string
      - name: tags
        in: query
        required: false
        description: 'JSON array of tags; Raiju events carry none, so a tag matches nothing'
        schema:
          type: string
      - name: start_date
        in: query
        required: false
        description: 'At or after this time: RFC 3339 or YYYY-MM-DD'
        schema:
          type: string
      - name: end_date
        in: query
        required: false
        description: 'At or before this time: RFC 3339 or YYYY-MM-DD (a date is the end of that day)'
        schema:
          type: string
      - name: period
        in: query
        required: false
        description: 'A window ending now (30m, 24h, 7d); overrides start_date and end_date'
        schema:
          type: string
      - name: sort_by
        in: query
        required: false
        description: 'event_time (the only order)'
        schema:
          type: string
      - name: sort_order
        in: query
        required: false
        description: 'desc (default) or asc'
        schema:
          type: string
      - name: since
        in: query
        required: false
        description: Epoch milliseconds, inclusive
        schema:
          type: number
      - name: until
        in: query
        required: false
        description: Epoch milliseconds, inclusive
        schema:
          type: number
      - name: limit
        in: query
        required: false
        description: Page size (at most 1000)
        schema:
          type: integer
          format: int64
          default: 100
      - name: offset
        in: query
        required: false
        description: Rows to skip
        schema:
          type: integer
          format: int64
          default: 0
