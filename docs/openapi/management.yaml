        '401':
          description: Authentication required, or the session or token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: An admin user's name and password.
    bearerAuth:
      type: http
      scheme: bearer
      description: A user token, or a session token (sk-sess-...).
  schemas:
    AccessProfile:
      type: object
      properties:
        id: &id025
          type: string
        name: *id025
        description: *id025
        roles:
          type: array
          description: The custom roles the profile is attached to; every user holding one of them holds the profile.
          items:
            $ref: '#/components/schemas/ProfileRole'
        provider_configs:
          type: array
          items:
            $ref: '#/components/schemas/VirtualKeyProviderConfig'
        allowed_models: &id026
          type: array
          items: *id025
        denied_models: *id026
        budget_id: *id025
        rate_limit_id: *id025
        mcp_tools: *id026
        required_headers: *id026
        max_tokens: &id028
          type: integer
          format: int64
        is_active: &id027
          type: boolean
      required:
      - id
      description: 'Raiju: a reusable permission set that virtual keys reference.'
    AccessProfileList:
      type: object
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/AccessProfile'
      required:
      - profiles
    AdminUser:
      type: object
      properties:
        name: *id025
        role: *id025
        disabled: *id027
      required:
      - name
      - role
      - disabled
      description: 'Raiju: an admin user. Built-in roles or a custom role name; no token.'
    AdminUserCreated:
      type: object
      properties:
        name: *id025
        role: *id025
        disabled: *id027
        token:
          type: string
          description: Shown once
      required:
      - name
      - role
      - disabled
      - token
    AdminUserList:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
      required:
      - users
    AdminUserUpdate:
      type: object
      properties:
        role: *id025
        disabled: *id027
    AdminUserWrite:
      type: object
      properties:
        name:
          type: string
          description: '1 to 64 chars: lower-case letters, digits, _ - @ . +'
        role: *id025
      required:
      - name
      - role
    AlertChannel:
      type: object
      properties:
        id: *id025
        name: *id025
        description: *id025
        type:
          type: string
          enum:
          - webhook
          - slack
          - microsoft_teams
          - pagerduty
        enabled: *id027
        cooldown_milliseconds: *id028
        config: &id029
          type: object
          additionalProperties: true
      required:
      - id
      - type
      description: 'Raiju: an alert channel; secrets in config are masked.'
    AlertChannelList:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: '#/components/schemas/AlertChannel'
      required:
      - channels
    AlertChannelWrite:
      type: object
      properties:
        id: *id025
        name: *id025
        description: *id025
        type: *id025
        enabled: *id027
        cooldown_milliseconds: *id028
        config:
          type: object
          properties:
            url: *id025
            webhook_url: *id025
            headers:
              type: object
              additionalProperties: *id025
            routing_key: *id025
      required:
      - type
      - config
      description: 'Config keys: webhook (url, headers), slack or microsoft_teams (webhook_url), pagerduty (routing_key).'
    AlertDeleted:
      type: object
      properties:
        deleted:
          type: boolean
        id: *id025
      required:
      - deleted
      - id
    AlertHistoryPage:
      type: object
      properties:
        history:
          type: array
          items: *id029
        total: *id028
        limit: *id028
        offset: *id028
      required:
      - history
      - total
    AlertRule:
      type: object
      properties:
        id: *id025
        name: *id025
        description: *id025
        enabled: *id027
        scope_type:
          type: string
          enum:
          - virtual_key
          - team
          - customer
        scope_id: *id025
