# Generated from the routes the gateway dispatches; checked by tests/openapi_check.py.
openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Raiju management API
  version: 0.1.0
  summary: The /api/* management routes of the Raiju gateway, plus /health, /ready, /metrics, MCP and the MCP tool endpoint.
  description: 'Every /api/* route Raiju dispatches, one operation each. The inference routes (/v1/*, /openai/*,
    /anthropic/*, /genai/*, /bedrock/*, /cohere/*) follow Bifrost''s OpenAPI and are not described here.


    Authentication: when dashboard authentication is off (the default), management routes are open, unless setup_token
    is set: then Bifrost''s setup lock holds every route but the public ones until an admin account exists, and a
    call needs X-Bifrost-Setup-Token (a wrong one is a 403) or the setup session cookie from POST /api/session/setup
    (401 without either). When it is on,
    send Basic credentials of an admin user, or Authorization: Bearer with a user token (shown once when the user
    is created) or a session token from POST /api/session/login or SSO (sk-sess-...). Each operation names the RBAC
    permission it needs in x-raiju-permission, the Bifrost resource and operation a custom role must hold in x-raiju-resource
    and x-raiju-operation, and the built-in roles that pass in x-raiju-roles. Built-in roles: admin (all), editor
    (read all; write providers and the governance collections virtual keys, budgets, rate limits, teams, customers
    and access profiles), viewer (read, but not the audit log), auditor (audit logs and request logs only). Writes
    are recorded in the audit log when audit.enabled is set.


    Errors are JSON {"error": {"message": ...}}. Bodies are JSON. Ids are the path segment; a record created without
    an id gets a generated one (the prefix shows the kind: vk-, budget-, rl-, team-, customer-, key-, project-,
    bu-, rule-, channel-, wh_, pr_, pv_, pd_).


    Where Raiju answers in Bifrost''s shape, the component carries Bifrost''s name; the description says where the
    fields differ. Raiju-only routes and components are marked in their descriptions.'
servers:
- url: http://localhost:8080
  description: The default -port 8080
tags:
- name: Health
- name: MCP protocol
- name: Cluster
- name: Sessions
- name: MCP gateway
- name: Config
- name: Providers
- name: Governance
- name: Models
- name: Projects
- name: Business units
- name: Access profiles
- name: Roles and users
- name: Audit
- name: Logs
- name: MCP logs
- name: Alerts
- name: Alerting
- name: Circuit breaker
- name: Secrets
- name: Prompt repository
- name: Webhooks
- name: Feature flags
- name: Notifications
- name: Agents
- name: A2A gateway
- name: API keys
- name: Crew routing
security:
- basicAuth: []
- bearerAuth: []
- {}
paths:
  /health:
    get:
      tags:
      - Health
      summary: 'Liveness check: the gateway answers'
      operationId: getHealth
      security: []
      x-raiju-permission: none
      x-raiju-gate: none
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags:
      - Health
      summary: 'Readiness check (Raiju-only): whether this process should get traffic'
      description: 'Raiju-only (Bifrost has /health alone). 503 while the process drains for a stop (SIGTERM or SIGINT:
        from the signal until it exits, see server.shutdown_grace_seconds and shutdown_delay_seconds), or when a store
        that is enabled could not open (logs_store, audit). A config change that could not be saved is reported in
        components.config but keeps the process ready. Use /health for liveness and /ready for readiness probes.
        With -workers, each worker answers for itself.'
      operationId: getReady
      security: []
      x-raiju-permission: none
      x-raiju-gate: none
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Not ready (draining, or a store that is on could not open)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /metrics:
    get:
      tags:
      - Health
      summary: Prometheus text metrics
      description: 'Families follow Bifrost''s telemetry plugin; the raiju_* families are Raiju''s own. The crew routing families (raiju_crew_assignments_total, raiju_crew_calls_total, raiju_crew_attempts_total, raiju_crew_escalations_total, raiju_crew_accepts_total, raiju_crew_outcomes_total, raiju_crew_outcome_quality, raiju_crew_task_cost_usd, raiju_crew_lambda, raiju_crew_subscription_phi) are described in docs/crew-routing.md. Counters and histograms add up over the workers of a node; the lambda and quota gauges take the largest.'
      operationId: getMetrics
      security: []
      x-raiju-permission: none
      x-raiju-gate: none
      responses:
        '200':
          description: Text
          content:
            text/plain:
              schema:
                type: string
  /mcp:
    post:
      tags:
      - MCP protocol
      summary: 'MCP server endpoint (JSON-RPC 2.0): initialize, tools/list, tools/call over the connected MCP clients'
      operationId: postMcp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpJsonRpcRequest'
      security: []
      x-raiju-permission: none
      x-raiju-gate: 'virtual key (x-bf-vk or Authorization: Bearer sk-bf-...) when governance enforcement is on, or a
        Bearer JWT issued by the MCP authorization server (client.mcp_server_auth_mode both or oauth; then the
        401 carries WWW-Authenticate with resource_metadata); 404 when no MCP servers are connected'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpJsonRpcResponse'
        '401':
          description: Authentication required, or the session or token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '403':
          description: The caller's role or data access scope does not cover this route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '404':
          description: No such record (or the route is not served for this input).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '405':
          description: The method is not allowed on this route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
    delete:
      tags:
      - MCP protocol
      summary: End an MCP session (the Mcp-Session-Id header names it)
      operationId: deleteMcp
      security: []
      x-raiju-permission: none
      x-raiju-gate: same as POST /mcp
      responses:
        '204':
          description: No content
        '404':
          description: No such record (or the route is not served for this input).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '405':
          description: The method is not allowed on this route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
    get:
      tags:
      - MCP protocol
      summary: Server-to-client event stream (a connection event, then a heartbeat comment every 15 s until the client leaves)
      operationId: getMcp
      security: []
      x-raiju-permission: none
      x-raiju-gate: same as POST /mcp
      responses:
        '200':
          description: 'text/event-stream: a connection/opened event, then ": heartbeat" comment lines every 15 seconds; the stream stays open until the client closes it'
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Authentication required, or the session or token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '404':
          description: No such record (or the route is not served for this input).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
  /mcp/{name}:
    get:
      tags:
      - MCP protocol
      summary: Server-to-client event stream for one virtual MCP (a connection event, then heartbeats until the client leaves)
      operationId: getMcpName
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Name of the virtual MCP
      security: []
      x-raiju-permission: none
      x-raiju-gate: same as POST /mcp/{name}
      responses:
        '200':
          description: 'text/event-stream: a connection/opened event, then ": heartbeat" comment lines every 15 seconds; the stream stays open until the client closes it'
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Authentication required, or the session or token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '404':
          description: No such record (or the route is not served for this input).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
    post:
      tags:
      - MCP protocol
      summary: MCP server endpoint for one virtual MCP (its tool set, under its name)
      operationId: postMcpName
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Name of the record (MCP client, virtual MCP, role, admin user, or policy)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpJsonRpcRequest'
      security: []
      x-raiju-permission: none
      x-raiju-gate: virtual key; 403 when the key may not use this virtual MCP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpJsonRpcResponse'
        '401':
          description: Authentication required, or the session or token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '403':
          description: The caller's role or data access scope does not cover this route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '404':
          description: No such record (or the route is not served for this input).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '405':
          description: The method is not allowed on this route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
    delete:
      tags:
      - MCP protocol
      summary: End an MCP session on one virtual MCP
      operationId: deleteMcpName
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Name of the record (MCP client, virtual MCP, role, admin user, or policy)
      security: []
      x-raiju-permission: none
      x-raiju-gate: same as POST /mcp/{name}
      responses:
        '204':
          description: No content
        '403':
          description: The caller's role or data access scope does not cover this route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '404':
          description: No such record (or the route is not served for this input).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '405':
          description: The method is not allowed on this route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
  /v1/mcp/tool/execute:
    post:
      tags:
      - MCP protocol
      summary: Run one MCP tool call given as an OpenAI-style tool call; the answer is a tool message
      operationId: postV1McpToolExecute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteToolRequest'
      security: []
      x-raiju-permission: none
      x-raiju-gate: virtual key when governance enforcement is on
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolMessage'
        '400':
          description: The body or a parameter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '401':
          description: Authentication required, or the session or token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '404':
          description: No such record (or the route is not served for this input).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '502':
          description: An upstream dependency failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
  /api/cluster/leader:
    get:
      tags:
      - Cluster
      summary: Whether this node leads, and by which election (cluster peers only)
      operationId: getApiClusterLeader
      security: []
      x-raiju-permission: none
      x-raiju-gate: HMAC-SHA256 of an empty body in x-raiju-cluster-sig with the cluster secret; 401 otherwise, 404 when
        clustering is off
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  node:
                    type: string
                    description: This node's id.
                  leader:
                    type: boolean
                  election:
                    type: string
                    enum:
                    - lock
                    - rank
                    description: lock when cluster_config.leader_lock elects through an etcd lease; rank otherwise (lowest live node id).
        '401':
          description: Authentication required, or the session or token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '404':
          description: Clustering is off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
  /api/cluster/sync:
    post:
      tags:
      - Cluster
      summary: Merge a peer's counters and answer ours (cluster peers only)
      operationId: postApiClusterSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterCountersBody'
      security: []
      x-raiju-permission: none
      x-raiju-gate: HMAC-SHA256 of the body in x-raiju-cluster-sig with the cluster secret; 401 otherwise, 404 when
        clustering is off
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterCounters'
        '400':
          description: The body or a parameter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '401':
          description: Authentication required, or the session or token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '404':
          description: No such record (or the route is not served for this input).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
  /api/cluster/feed:
    post:
      tags:
      - Cluster
      summary: Take a peer's live-feed events into this node's feed (cluster peers only, Raiju extra)
      description: The /ws feed of every node carries the events of all nodes. A node relays its own events to its peers in batches (about 100 ms, cluster.feed.batch_ms); each event has a producer (node, or node/pid for one worker), a sequence, a timestamp, its data scope and its data as the dashboard's JSON text. Events already seen are not added again.
      operationId: postApiClusterFeed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - items
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                    - node
                    - seq
                    - ts
                    - data
                    properties:
                      node:
                        type: string
                        description: The producer of the event (the node id, or node/pid for one worker).
                      seq:
                        type: integer
                        description: The producer's sequence number, above zero and rising with each event.
                      ts:
                        type: number
                        description: The request's time, in ms since the epoch.
                      team:
                        type: string
                      bu:
                        type: string
                      customer:
                        type: string
                      project:
                        type: string
                      data:
                        type: string
                        description: The event's JSON object text (the dashboard's view of the request-log entry).
      security: []
      x-raiju-permission: none
      x-raiju-gate: HMAC-SHA256 of the body in x-raiju-cluster-sig with the cluster secret; 401 otherwise, 404 when clustering is off or cluster.feed.cluster_wide is false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: integer
                    description: How many of the events were new to this node.
        '400':
          description: The body or a parameter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '401':
          description: Authentication required, or the session or token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '404':
          description: No such record (or the route is not served for this input).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
  /api/oidc/status:
    get:
      tags:
      - Sessions
      summary: Whether SSO (OIDC) is configured
      operationId: getApiOidcStatus
      security: []
      x-raiju-permission: none
      x-raiju-gate: none
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCStatus'
  /api/oidc/login:
    get:
      tags:
      - Sessions
      summary: 'Start an SSO sign-in: redirects to the identity provider'
      description: With return_to, the sign-in returns to that page of the gateway once it completes (only the MCP consent
        pages, /oauth/consent?... and /workspace/mcp-sessions/auth?..., are accepted; anything else returns to /).
      operationId: getApiOidcLogin
      parameters:
      - name: return_to
        in: query
        required: false
        schema:
          type: string
        description: The consent page (path and query) to come back to after the sign-in
      security: []
      x-raiju-permission: none
      x-raiju-gate: none; 404 when SSO is off
      responses:
        '302':
          description: Redirect to the identity provider
        '404':
          description: No such record (or the route is not served for this input).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '502':
          description: An upstream dependency failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
  /api/oidc/callback:
    get:
      tags:
      - Sessions
      summary: 'SSO callback: completes the sign-in and shows the result page'
      operationId: getApiOidcCallback
      security: []
      x-raiju-permission: none
      x-raiju-gate: none; the single-use state from the login redirect is required
      responses:
        '200':
          description: Text
          content:
            text/html:
              schema:
                type: string
        '401':
          description: Authentication required, or the session or token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '403':
          description: The account is disabled in governance (a SCIM deactivation, say), so no session is made. The result page says so.
          content:
            text/html:
              schema:
                type: string
        '404':
          description: No such record (or the route is not served for this input).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '502':
          description: An upstream dependency failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
  /api/oauth/callback:
    get:
      tags:
      - MCP gateway
      summary: 'MCP OAuth callback: the authorization server returns here; saves the tokens'
      operationId: getApiOauthCallback
      parameters:
      - name: code
        in: query
        required: false
        description: Authorization code
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: Flow state from the authorize URL
        schema:
          type: string
      - name: error
        in: query
        required: false
        description: Error from the authorization server
        schema:
          type: string
      security: []
      x-raiju-permission: none
      x-raiju-gate: none; the state parameter must match a pending flow
      responses:
        '200':
          description: Text
          content:
            text/html:
              schema:
                type: string
  /api/session/is-auth-enabled:
    get:
      tags:
      - Sessions
      summary: Whether dashboard authentication is on, and whether this token is valid
      operationId: getApiSessionIsAuthEnabled
      security: []
      x-raiju-permission: none
      x-raiju-gate: none
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsAuthEnabledResponse'
  /api/session/login:
    post:
      tags:
      - Sessions
      summary: Sign in with a user name and password; returns a session token
      operationId: postApiSessionLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
      x-raiju-permission: none
      x-raiju-gate: none; checks the password of a stored admin user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: The body or a parameter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '401':
          description: Authentication required, or the session or token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '403':
          description: The caller's role or data access scope does not cover this route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
  /api/session/logout:
    post:
      tags:
      - Sessions
      summary: Drop the session token sent in the Authorization header
      operationId: postApiSessionLogout
      security: []
      x-raiju-permission: none
      x-raiju-gate: none
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/version:
    get:
      tags:
      - Config
      summary: The gateway version
      operationId: getApiVersion
      x-raiju-permission: read
      x-raiju-resource: Settings
      x-raiju-operation: View
      x-raiju-roles:
      - admin
      - editor
      - viewer
      x-raiju-gate: 'RBAC: read (custom roles need Settings / View)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '401':
          description: Authentication required, or the session or token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '403':
          description: The caller's role or data access scope does not cover this route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
  /api/config/metadata:
    post:
      tags:
      - Config
      summary: Merge UI and admin preferences into the config metadata; null removes a key
      operationId: postApiConfigMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: [string, number, boolean, 'null']
      x-raiju-permission: write
      x-raiju-resource: Settings
      x-raiju-operation: Update
      x-raiju-roles:
      - admin
      x-raiju-gate: 'RBAC: write (custom roles need Settings / Update)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400':
          description: The body or a parameter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '401':
          description: Authentication required, or the session or token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
        '403':
          description: The caller's role or data access scope does not cover this route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementErrorResponse'
  /api/config:
    get:
      tags:
      - Config
      summary: The whole configuration, with secrets replaced by <redacted>
      operationId: getApiConfig
      x-raiju-permission: read
      x-raiju-resource: Settings
      x-raiju-operation: View
      x-raiju-roles:
      - admin
      - editor
      - viewer
      x-raiju-gate: 'RBAC: read (custom roles need Settings / View)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
