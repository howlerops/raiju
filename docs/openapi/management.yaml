    AgentUpstreamAuth:
      type: object
      description: Authentication for the card fetch (discovery_auth) or the proxied calls (runtime_auth). Header values, the OAuth client and the TLS certificates may be env.NAME references; stored values are returned masked.
      properties:
        type:
          type: string
          enum:
          - none
          - headers
          - oauth
        headers:
          type: object
          additionalProperties:
            type: string
        oauth:
          type: [object, 'null']
          description: A client-credentials grant (type oauth). The token endpoint is token_url, or the token_endpoint that discovery_url (or provider_url's /.well-known/oauth-authorization-server) names on its own origin. The token is kept until 30 seconds before it expires.
          properties:
            provider_url:
              type: [string, 'null']
            discovery_url:
              type: [string, 'null']
            token_url:
              type: [string, 'null']
            client_id:
              type: string
            client_secret:
              type: string
            scopes:
              type: array
              items:
                type: string
            resource:
              type: [string, 'null']
        security_schemes:
          type: array
          items:
            type: string
          description: The card requirements this configuration satisfies (recorded, not enforced).
        advanced:
          type: boolean
          description: Records that the authentication was configured by hand rather than from the card.
        tls:
          type: [object, 'null']
          description: How https connections to the card and the agent are checked. The client certificate and key are stored but not used (no client certificates in Raiju's HTTP client).
          properties:
            insecure_skip_verify:
              type: boolean
            ca_cert_pem:
              type: string
            client_cert_pem:
              type: string
            client_key_pem:
              type: string
      required:
      - type
    AgentRegistrationRequest:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 255
          description: The registration name; it forms the gateway routes under /agents/a2a/{name}. Fixed for the life of the registration.
        agent_card_url:
          type: string
          description: Absolute http(s) URL of the agent's card, without user information.
        enabled:
          type: boolean
          default: true
        allow_by_default:
          type: boolean
          description: Allow any identified virtual key to call the agent without a grant.
        forward_accepted_credential:
          type: boolean
          description: Send the caller's accepted gateway credential to the agent, on the header it came in on (x-bf-vk, Authorization, ...), so the agent can use it on its own LLM and MCP calls through the gateway. Off by default.
        forward_accepted_credential_overrides_auth:
          type: boolean
          description: With forward_accepted_credential, let the forwarded credential replace a header the registration's own auth sets on the same name (otherwise the configured one wins).
        virtual_key_ids:
          type: array
          items:
            type: string
          description: Virtual keys granted access. Empty and duplicate IDs are rejected.
        discovery_auth:
          $ref: '#/components/schemas/AgentUpstreamAuth'
        runtime_auth:
          $ref: '#/components/schemas/AgentUpstreamAuth'
        allow_private_network:
          type: boolean
          description: Raiju-only. Lets the card URL and the agent's endpoint be private addresses (the SSRF guard refuses them otherwise, as for webhooks).
        tenant:
          type: string
          description: Bifrost's tenant, kept and shown.
        extension_uris:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 2048
          description: The A2A extensions of the agent's card the gateway relays (absolute URIs, no duplicates; stored sorted).
      required:
      - agent_card_url
    AgentRegistration:
      type: object
      description: A registration, its cached card and the gateway's endpoints. Raiju-only shape (Bifrost's agent records differ).
      properties:
        name:
          type: string
        agent_card_url:
          type: string
        enabled:
          type: boolean
        allow_by_default:
          type: boolean
        forward_accepted_credential:
          type: boolean
        forward_accepted_credential_overrides_auth:
          type: boolean
        virtual_key_ids:
          type: array
          items:
            type: string
        discovery_auth:
          $ref: '#/components/schemas/AgentUpstreamAuth'
        runtime_auth:
          $ref: '#/components/schemas/AgentUpstreamAuth'
        allow_private_network:
          type: boolean
        tenant:
          type: string
        extension_uris:
          type: array
          items:
            type: string
        card:
          type: [object, 'null']
          additionalProperties: true
          description: The agent's card as last fetched; null until it is fetched.
        card_fetched_at:
          type: [integer, 'null']
          description: Unix milliseconds of the last fetch.
        endpoint:
          type: string
          description: The agent's own JSON-RPC endpoint (from its card); the gateway proxies to it.
        rest_endpoint:
          type: string
          description: The agent's own REST (HTTP+JSON) endpoint, "" when its card offers none.
        created_at:
          type: [integer, 'null']
        updated_at:
          type: [integer, 'null']
        gateway:
          type: object
          properties:
            agent_card_url:
              type: string
            json_rpc_url:
              type: string
            rest_url:
              type: string
