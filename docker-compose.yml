# Local run: `docker compose up --build`. Provider keys go in ./.env, one
# NAME=value per line (the config refers to them as env.NAME).
# Metrics: `docker compose --profile metrics up --build`, then Prometheus is
# on http://localhost:9090.
services:
  raiju:
    build: .
    image: raiju:local
    ports:
      - "8080:8080"
    env_file:
      - path: ./.env
        required: false
    volumes:
      # The gateway reads /app/data/config.json (its -app-dir is /app/data).
      - ./deploy/config.example.json:/app/data/config.json:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.4
    profiles: ["metrics"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - raiju
