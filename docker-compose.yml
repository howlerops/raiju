# Local run: `docker compose up --build`. Provider keys go in ./.env, one
# NAME=value per line (the config refers to them as env.NAME).
# The management API (/api, the dashboard) is locked until an admin exists:
# put BIFROST_SETUP_TOKEN=<a long random value> in .env and create the first
# admin with it (POST /api/users with the token in X-Bifrost-Setup-Token).
# Without it /api answers 403.
# Metrics: `docker compose --profile metrics up --build`, then Prometheus is
# on http://localhost:9090.
#
# The gateway's -app-dir, /app/data, is the named volume raiju-data: config.json
# and what Raiju writes beside it (API and UI changes, the MCP OAuth signing key,
# logs/ and logs/audit/) survive restarts and `docker compose down` (not
# `down -v`). raiju-config copies deploy/config.example.json in when the volume
# has no config.json yet; to start over from the file, `docker compose down -v`.
services:
  raiju-config:
    build: .
    image: raiju:local
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -f /app/data/config.json ]; then
          cp /app/seed/config.json /app/data/config.json.seed
          mv /app/data/config.json.seed /app/data/config.json
          echo "config.json copied from deploy/config.example.json"
        fi
    # no healthcheck for a one-shot copy
    healthcheck:
      disable: true
    volumes:
      - raiju-data:/app/data
      - ./deploy/config.example.json:/app/seed/config.json:ro
    restart: "no"

  raiju:
    # the same image as raiju-config (the second build is a cache hit)
    build: .
    image: raiju:local
    # the image's CMD, spelled out: every address (the binary binds 127.0.0.1 by default)
    command: ["-app-dir", "/app/data", "-host", "0.0.0.0", "-port", "8080"]
    depends_on:
      raiju-config:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    env_file:
      - path: ./.env
        required: false
    volumes:
      - raiju-data:/app/data
    # the image's HEALTHCHECK (raiju -healthcheck) marks the container healthy
    stop_grace_period: 35s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.4
    profiles: ["metrics"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      raiju:
        condition: service_healthy

volumes:
  raiju-data:
